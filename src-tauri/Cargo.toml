[package]
name = "open-ecalc"
version = "0.1.0"
description = "Offline drone mission calculator"
authors = ["Open eCalc contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "open_ecalc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
